name: sed-verify

# Temporary verification harness used while fixing uutils/sed PR #557.
# It builds several revisions of uutils/sed and compares instruction counts
# (valgrind/callgrind) on the benchmark workload that CodSpeed reports as
# regressed. It is not part of the plugin build and can be removed once the
# sed PR is green.

on:
  push:
    branches:
      - 'arena/01a0c8e5-site-kit-wp'
    paths:
      - '.github/sed-verify/**'
      - '.github/workflows/sed-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sed-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Measure sed PR 557
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind

      - name: Run verification
        env:
          SCALE: '100000'
          CHECK_TESTS: '1'
          EXTRA_SHAS: ''
          PATCH: ''
        run: |
          chmod +x .github/sed-verify/verify.sh
          .github/sed-verify/verify.sh || echo "::warning::harness exited non-zero, see log above"
