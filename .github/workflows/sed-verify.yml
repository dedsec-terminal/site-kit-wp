name: sed-verify

# Temporary verification harness used while fixing uutils/sed PR #557.
# It builds several revisions of uutils/sed and compares instruction counts
# (valgrind/callgrind) on the benchmark workload that CodSpeed reports as
# regressed. Results are emitted as check-run annotations because the Actions
# log-download endpoint is not reachable from the agent sandbox.
# This workflow can be removed once the sed PR is green.

on:
  push:
    branches:
      - 'arena/01a0c8e5-site-kit-wp'
    paths:
      - '.github/sed-verify/**'
      - '.github/workflows/sed-verify.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: 'Space separated patch files, relative to the repo root, applied on top of the PR head'
        required: false
        default: ''
      extra_shas:
        description: 'Space separated extra revisions of sed to measure'
        required: false
        default: ''
      check_tests:
        description: '1 to also run fmt/clippy/tests/GNU-sed diff on each patched tree'
        required: false
        default: '1'
      scale:
        description: 'Number of benchmark input lines'
        required: false
        default: '100000'

permissions:
  contents: read

concurrency:
  group: sed-verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Measure sed PR 557
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      - name: Read request
        run: |
          chmod +x .github/sed-verify/request.sh
          .github/sed-verify/request.sh \
            '${{ github.event.inputs.patches }}' \
            '${{ github.event.inputs.extra_shas }}' \
            '${{ github.event.inputs.check_tests }}' \
            '${{ github.event.inputs.scale }}'

      - name: Run verification
        run: |
          set +e
          chmod +x .github/sed-verify/verify.sh
          .github/sed-verify/verify.sh > /tmp/report.txt 2>&1
          status=$?
          echo "harness exit status: $status" >> /tmp/report.txt
          python3 .github/sed-verify/annotate.py /tmp/report.txt
          for f in "$HOME"/sedwork/formatted-*.patch; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .patch)"
            echo "---- publishing $base (annotations) ----"
            python3 .github/sed-verify/annotate.py "$f" 60000 6000 "$base"
          done
          echo "---- report tail (also available as annotations) ----"
          tail -c 4000 /tmp/report.txt
          exit 0
